<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Wars: The Battle for Video Game Sales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Console Wars: The Battle for Video Game Sales</h1>

    <p>How gaming platforms competed for game releases from 1980 to 2016</p>
    <p>The estimated global sales of video games across different platforms</p>

    <div id="chart"></div>

    <div id="timeline-controls">

        <button id="play-button">Play</button>
        <button id="restart-button">Restart</button>


        <label for="year-slider">Release Year:</label>

        <input
        type="range"
        id="year-slider"
        min="1980"
        max="2016"
        value="1980"
        step="1"
        >
        <span id="year-display">1980</span>

        <label for="speed-select">Speed:</label>
        <select id="speed-select">
            <option value="1000">1x</option>
            <option value="500">2x</option>
            <option value="250">3x</option>
        </select>

        <label for="top-select">Show:</label>
<select id="top-select">
    <option value="5" selected>Top 5</option>
    <option value="10">Top 10</option>
</select>


    </div>

    <script type="module" src = "main.js"></script>
    
</body>
</html>
